COM_LSCACHE_FIELD_VARY_MOBILE_LABEL="Vue séparée pour appareil mobile"
COM_LSCACHE_FIELD_VARY_MOBILE_DESC="Créer une copie cachée distincte de chaque page pour les appareils mobiles"
COM_LSCACHE_FIELD_PAGECACHE_VARY_LABEL="Faire varier le cache selon le consentement"
COM_LSCACHE_FIELD_PAGECACHE_VARY_DESC="Activé par défaut : le cache est cloisonné selon l'état de consentement publié par les extensions via onPageCacheGetKey. <strong>Ne désactivez ceci que si vous avez vérifié que le HTML servi par votre site est identique quel que soit le consentement</strong> — comparez plusieurs pages avec et sans cookie de consentement. Sur un site où il ne varie pas, le cloisonnement crée des copies identiques qu'il faut réchauffer séparément. <strong>Danger :</strong> si votre gestionnaire de consentement se met un jour à filtrer le HTML côté serveur, ce réglage servira les scripts de suivi aux visiteurs qui les ont refusés. Refaites la comparaison après toute modification de sa configuration."
COM_LSCACHE_FIELD_CONSENT_COOKIES_LABEL="Cookies portant une décision de consentement"
COM_LSCACHE_FIELD_CONSENT_COOKIES_DESC="Liste séparée par des virgules. Tant que le visiteur n'en porte aucun, il voit la sortie par défaut du site et partage une copie unique du cache — ce qui permet à PageSpeed, aux nouveaux visiteurs et à la reconstruction du cache de bénéficier du cache dès la première vue. Laisser vide fait varier le cache sur tous les états de consentement, ce qui est plus sûr mais réduit fortement le taux de hit. La valeur par défaut est le nom de cookie de la bibliothèque Cookie Consent, repris par la plupart des gestionnaires de consentement."
COM_LSCACHE_FIELD_PURGE_MESSAGE_LABEL="Afficher le message de purge"
COM_LSCACHE_FIELD_PURGE_MESSAGE_DESC="Afficher un message de confirmation de purge après que LiteSpeed ​​Cache est purgé avec des balises spécifiques"
COM_LSCACHE_FIELD_CLEAN_CACHE_LABEL="Mots sécurisés de l'interface Web"
COM_LSCACHE_FIELD_CLEAN_CACHE_NOTE="Interface Web pour purger tout le cache LiteSpeed: <a href='{webroot}index.php?option=com_lscache&cleanCache={secureword}'>{webroot}index.php?option=com_lscache&cleanCache={secureword}</a>"
COM_LSCACHE_FIELD_RECACHE_NOTE="Interface Web pour reconstruire tout LiteSpeed ​​Cache: <a href='{webroot}index.php?option=com_lscache&recache={secureword}'>{webroot}index.php?option=com_lscache&recache={secureword}</a>"
COM_LSCACHE_FIELD_ADMIN_IP_LABEL="Adresses IP administrateur"
COM_LSCACHE_FIELD_ADMIN_IP_HINT="Après la configuration, seules ces adresses IP et les IP locales du serveur Web sont autorisées à appeler l'interface Web ou à exécuter des scripts cron LiteSpeed Cache. Veuillez saisir une adresse IP par ligne."
COM_LSCACHE_FIELD_ADMIN_IP_DESCRIPTION="Après la configuration Seules ces IP et IP locales du serveur Web sont autorisées à appeler des interfaces Web ou à exécuter des scripts cron de LiteSpeed ​​Cache, veuillez saisir une adresse IP par ligne"

COM_LSCACHE_FIELDSET_LOGIN_LABEL="Utilisateurs connectés"
COM_LSCACHE_FIELDSET_LOGIN_DESC="Les règles de cache suivantes ne s'appliquent qu'aux utilisateurs connectés"
COM_LSCACHE_FIELD_LOGIN_CACHABLE_LABEL="Afficher le contenu mis en cache pour les utilisateurs connectés"
COM_LSCACHE_FIELD_LOGIN_CACHABLE_DESC="Avant d'activer cette fonctionnalité, vérifiez que toutes les règles d'exclusion et les modules ESI ont été configurés correctement"
COM_LSCACHE_FIELD_LOGIN_REMEMBER_LABEL="Vérifier le cookie de connexion Se souvenir de moi"
COM_LSCACHE_FIELD_LOGIN_REMEMBER_DESC="Activer cette option va frapper PHP pour vérifier le cookie Remember Me et la connexion automatique à la première visite du navigateur, veuillez purger tout le cache après le changement"
COM_LSCACHE_FIELD_LOGIN_CACHEVARY_LABEL="Cloisonnement du cache entre utilisateurs connectés"
COM_LSCACHE_FIELD_LOGIN_CACHEVARY_DESC="Nombre de copies distinctes de chaque page conservées pour les utilisateurs connectés. Ce réglage ne crée jamais une copie par utilisateur : au sein d'une même copie, tout le contenu personnalisé rendu dans le corps de la page (nom, panier, prix) est partagé entre les utilisateurs concernés. Seuls les modules déclarés en ESI privé sont isolés par session.<br>Aucun : les utilisateurs connectés reçoivent les pages mises en cache pour les visiteurs anonymes.<br>Une copie unique partagée : une seule copie pour l'ensemble des utilisateurs connectés, distincte de celle des visiteurs anonymes.<br>Une copie par groupe Joomla : un utilisateur membre de plusieurs groupes n'est alors jamais mis en cache. Attention, il s'agit des groupes d'utilisateurs Joomla, sans lien avec les groupes tarifaires d'un composant e-commerce."
COM_LSCACHE_FIELD_LOGIN_EXCLUDE_NOTE = "Les pages Web exclues ne seront pas mises en cache après la connexion de l'utilisateur.<br>Si une page Web a déjà été exclue via l'onglet 'Règles d'exclusion', vous n'avez pas besoin de l'exclure ici à nouveau."
COM_LSCACHE_FIELD_LOGIN_CACHEVARY_NONE = "Aucun"
COM_LSCACHE_FIELD_LOGIN_CACHEVARY_ALLUSER = "Une copie unique partagée"
COM_LSCACHE_FIELD_LOGIN_CACHEVARY_BYGROUP = "Une copie par groupe Joomla"


COM_LSCACHE_FIELDSET_RECACHE_LABEL="Remettre en cache"
COM_LSCACHE_FIELDSET_RECACHE_DESC="Remettre en cache des pages Web spécifiques après que le cache a été purgé"
COM_LSCACHE_FIELD_RECACHE_AUTORECACHE_LABEL = "Recache automatique"
COM_LSCACHE_FIELD_RECACHE_AUTORECACHE_DESC="Remettre en cache automatiquement les pages après qu'elles ont été purgées du cache."
COM_LSCACHE_FIELD_RECACHE_AUTORECACHE_MODERATE="Modéré"
COM_LSCACHE_FIELD_RECACHE_AUTORECACHE_AGGRESSIVE="Agressif"
COM_LSCACHE_FIELD_RECACHE_AUTORECACHE_NOTE="Agressif: Remettez en cache toutes les pages Web associées possibles. Recommandé pour les petits sites Web de 100 pages Web ou moins.<br>Modéré: remettez en cache la plupart des pages Web associées. Recommandé pour les grands sites Web ou les sites Web fréquemment mis à jour <br> * Après une purge automatique de tout, vous ne pouvez remettre en cache que manuellement."
COM_LSCACHE_FIELD_RECACHE_DURATION_LABEL="Durée maximale de la mise en cache automatique (secondes)"
COM_LSCACHE_FIELD_RECACHE_DURATION_DESC="La durée maximale (en secondes) autorisée pour la mise en cache automatique"
COM_LSCACHE_FIELD_CRAWL_CONCURRENCY_LABEL="Pages mises en cache en parallèle"
COM_LSCACHE_FIELD_CRAWL_CONCURRENCY_DESC="Nombre de pages demandées simultanément pendant une reconstruction. Le crawl passe son temps à attendre le serveur : les paralléliser divise la durée d'autant. Au-delà de 5 à 10, vous risquez de saturer le pool PHP du site pendant l'opération. Entre 1 et 20, défaut 5."
COM_LSCACHE_FIELD_CRAWL_DELAY_LABEL="Pause entre deux lots (millisecondes)"
COM_LSCACHE_FIELD_CRAWL_DELAY_DESC="Temps d'attente entre deux lots de pages. Zéro par défaut, puisque vous crawlez votre propre site. À augmenter seulement si la reconstruction gêne les visiteurs pendant qu'elle tourne."
COM_LSCACHE_FIELD_CRON_NOTE="<strong>Reconstruction planifiée</strong><br>Le bouton « Reconstruire tout le cache » lance le crawl dans un processus détaché, que le serveur web peut interrompre s'il dure trop longtemps. En ligne de commande cette limite n'existe pas : c'est la voie fiable pour un gros catalogue.<br><br>Test à blanc, sans rien mettre en cache :<br><code>{phpbin} {clipath}{urlopt} --dry-run</code><br><br>Tâche cron, chaque nuit à 3 h (heure du serveur, souvent UTC) :<br><code>0 3 * * * {phpbin} {clipath}{urlopt} --quiet</code><br><br>{conditionnels}Ces commandes sont des <strong>exemples à adapter</strong>. Le binaire qui sert vos pages est <code>{phpdetected}</code> (PHP {phpver}) : utilisez-le si <code>/usr/bin/php</code> n'existe pas chez vous ou pointe vers une autre version. Attention, un chemin figé sur une version précise deviendra invalide le jour où vous migrerez PHP, et la reconstruction s'arrêtera sans avertissement. La barre de progression du panneau LSCache suit une reconstruction lancée en cron comme une autre."
COM_LSCACHE_FIELD_CRON_NOTE_CONSENT="<strong>Le crawl par défaut ne réchauffe que le compartiment des visiteurs sans décision de consentement</strong> — la première page vue avant de répondre à la bannière, les robots, PageSpeed. Un vrai visiteur qui accepte ou refuse bascule aussitôt dans un autre compartiment, jamais rempli par ce crawl. Pour réchauffer aussi ces variantes, enchaînez plusieurs passes avec <code>--cookie</code>, en les reliant par <code>&amp;&amp;</code> pour que chacune attende la fin de la précédente. Ajoutez <code>--label</code> à chaque passe pour que l'historique de la carte affiche un intitulé clair plutôt que la valeur brute du cookie :<br><code>0 3 * * * {phpbin} {clipath}{urlopt} --label='Visite standard' --quiet &amp;&amp; {phpbin} {clipath}{urlopt} --cookie={consentcookie}=allow --label='Cookies acceptés' --quiet &amp;&amp; {phpbin} {clipath}{urlopt} --cookie={consentcookie}=deny --label='Cookies refusés' --quiet</code><br><br>"
COM_LSCACHE_FIELD_CRON_NOTE_DEVICE="Si le réglage « Vue séparée pour appareil mobile » est actif, chacune de ces passes ne réchauffe que le compartiment bureau : doublez-les avec <code>--user-agent=mobile</code> pour couvrir aussi les visiteurs mobiles.<br><br>"
COM_LSCACHE_FIELD_CRON_NOTE_PURGECHANGED="<strong>Stock et prix modifiés hors de VirtueMart</strong> — imports CSVI ou Rocsvi, scripts SQL : LiteSpeed n'en est jamais prévenu, et les pages en cache gardent l'ancien bouton (« Ajouter au panier » ou « Tenez-moi au courant ») jusqu'à leur expiration. Une seconde tâche, toutes les 5 minutes, compare d'un passage à l'autre ce que les pages affichent (palier de stock, prix, publication), puis purge et réchauffe les seules fiches et listes concernées. Elle réchauffe aussi les pages que les commandes confirmées ont purgées, si « Recache automatique » est actif. Le premier passage ne purge rien : il enregistre l'état de référence. Ajoutez <code>--dry-run</code> pour voir ce qui serait purgé sans rien toucher :<br><code>*/5 * * * * {phpbin} {clipath}{urlopt} --purge-changed --quiet</code><br><br>"
COM_LSCACHE_ERR_CRAWL_BUSY="Une reconstruction est déjà en cours (dernière activité il y a %d s)."
